function closePanel(){if(byId('panel').hidden)return;byId('panel').hidden=true;byId('shade').hidden=true;returnFocus?.focus();}
function panelTexts(unit,kind,heading){const seen=new Set([String(heading??'').trim().replace(/\s+/g,' ')]);return (kind==='goal'?[unit.goal,unit.description]:[unit.result,unit.result_detail]).filter(text=>{if(typeof text!=='string')return false;const key=text.trim().replace(/\s+/g,' ');if(!key||seen.has(key))return false;seen.add(key);return true;});}
function openPanel(unit,kind,trigger){returnFocus=trigger;const content=byId('panel-content');content.replaceChildren();byId('panel-title').textContent=`${unit.cu_id} · ${kind==='goal'?'Control Unit':'Результат'}`;const heading=kind==='goal'?unit.title:unit.result;content.append(element('h3',heading));for(const text of panelTexts(unit,kind,heading))content.append(element('p',text,'stored'));content.append(budgetDetails(unit));content.append(element('p',`Длительность существования CU: ${duration(unit.elapsed_ms)}`,'status'));content.append(element('p',`Измеренные ходы штаба, включая ожидания: ${duration(unit.reported_ms)}`,'status'));if(unit.sources?.length){content.append(element('h3','Источники'));for(const source of unit.sources){const box=element('div',undefined,'source');const href=safeLink(source.path);if(href){const a=element('a',source.label||source.path);a.href=href;a.target='_blank';a.rel='noopener noreferrer';box.append(a);}else box.append(element('strong',source.label||'Источник'));if(source.path)box.append(element('small',source.path));if(source.text)box.append(element('p',source.text,'stored'));content.append(box);}}byId('panel').hidden=false;byId('shade').hidden=false;byId('close').focus();}
byId('close').addEventListener('click',closePanel);byId('shade').addEventListener('click',closePanel);
document.addEventListener('keydown',event=>{if(byId('panel').hidden)return;if(event.key==='Escape'){event.preventDefault();closePanel();}if(event.key==='Tab'){const nodes=[...byId('panel').querySelectorAll('button,a[href]')];const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
function detailRow(unit,id){const row=element('tr',undefined,'team-detail');row.id=id;row.hidden=true;const cell=element('td');cell.colSpan=7;const table=element('table');table.setAttribute('aria-label',`Команда ${unit.cu_id}`);table.append(element('caption',`Команда · ${unit.cu_id}`));const head=element('thead'),hr=element('tr');for(const label of ['Участник','Роль','Модель','Reasoning','Время','Вход из кэша','Вход вне кэша','Выход','Стоимость, WU'])hr.append(element('th',label));head.append(hr);table.append(head);const body=element('tbody');for(const p of unit.participants||[]){const tr=element('tr'),name=element('td',p.name||p.participant_id||'—');if(coverage[p.coverage])name.append(element('span',coverage[p.coverage],'partial'));tr.append(name);for(const key of ['role','model','reasoning'])tr.append(element('td',p[key]||'—'));tr.append(element('td',duration(p.elapsed_ms),'number'));usageCells(tr,p.usage);tr.append(costCell(p.work_units));body.append(tr);}const total=element('tr'),label=element('th','Итого · время ходов штаба');label.colSpan=4;total.append(label,element('td',duration(unit.reported_ms),'number'));usageCells(total,unit.usage);total.append(costCell(unit.work_units));body.append(total);table.append(body);cell.append(table);if(unit.telemetry_provenance?.method==='read_only_anchor_derivation'){cell.append(element('p','Расход собран автоматически из журналов.','status'));const notes=new Set([...(unit.telemetry_diagnostics||[]),...(unit.participants||[]).flatMap(p=>p.telemetry_diagnostics||[])]);if(notes.has('parent_child_scope_not_verified'))cell.append(element('p','Общий расход не определён: независимость счётчиков штаба и агентов пока не подтверждена.','status'));if(notes.has('pending_turn'))cell.append(element('p','Последний ход ещё не завершён; расход уточнится при следующем открытии отчёта.','status'));if(notes.has('ambiguous_turn_claim')||notes.has('ambiguous_parent_turn_claim'))cell.append(element('p','Один ход связан с несколькими CU; расход не разделён наугад.','status'));}if(unit.reported_ms!=null)cell.append(element('p',`Измеренное время ходов штаба: ${duration(unit.reported_ms)}`,'status'));row.append(cell);return row;}
function pageState(total,size,page){const count=Math.max(1,Math.ceil(total/size));page=Math.max(0,Math.min(count-1,page));return {page,count,start:page*size,end:Math.min(total,(page+1)*size)};}
function renderView(dataset){
closePanel();data=dataset;byId('units').replaceChildren();root.querySelector('main table tfoot')?.remove();root.querySelector('main > details')?.remove();root.querySelector('main > nav')?.remove();const header=root.querySelector('header');while(header.children.length>2)header.lastElementChild.remove();
byId('title').textContent=data.title||'Control Units';byId('generated').textContent=`Сформировано: ${time(data.generated_at)} МСК`;
data.units.forEach((unit,index)=>{const row=element('tr');row.dataset.cuId=unit.cu_id;row.append(element('td',unit.cu_id,'number'),element('td',time(unit.started_at),'number'));for(const kind of ['goal','result']){const cell=element('td',undefined,kind==='goal'?'unit-title':'result'),button=element('button',(kind==='goal'?unit.title:unit.result)||'—','link');button.type='button';button.setAttribute('aria-haspopup','dialog');button.addEventListener('click',()=>openPanel(unit,kind,button));cell.append(button);if(kind==='goal')cell.append(element('span',statuses[unit.status]||unit.status||'—','status'));row.append(cell);}const elapsed=element('td',duration(unit.reported_ms),'number');row.append(elapsed);const teamCell=element('td'),team=element('button','Команда','team'),id=`team-${index}`;team.type='button';team.setAttribute('aria-expanded','false');team.setAttribute('aria-controls',id);const detail=detailRow(unit,id);team.addEventListener('click',()=>{detail.hidden=!detail.hidden;team.setAttribute('aria-expanded',String(!detail.hidden));});teamCell.append(team);row.append(teamCell);row.append(budgetCell(unit));byId('units').append(row,detail);});byId('empty').hidden=data.units.length>0;
// Scope and totals always describe the complete selection, independent of page.
const timingNote=element('p','Время — длительность измеренных ходов штаба, включая ожидания; не активное вычисление.');root.querySelector('header').append(timingNote);
const scope=element('p',data.scope?.usage_label||'Расход выбранных CU за всё выполнение');
if(data.scope?.label)scope.prepend(document.createTextNode(`${data.scope.label} · `));
if(data.covers_from)scope.append(document.createTextNode(` · Данные с ${time(data.covers_from)} МСК`));
root.querySelector('header').append(scope);
const totalRow=element('tr'),totalLabel=element('th',`Итого по всей выбранной истории · ${data.units.length} CU`);totalLabel.colSpan=6;totalRow.append(totalLabel,costCell(data.work_units?.total,'td','Факт '));const foot=element('tfoot');foot.append(totalRow);root.querySelector('main table').append(foot);
renderMethod();
const pairs=[...byId('units').children];let page=0;const pageSize=Number.isInteger(data.page_size)&&data.page_size>0?data.page_size:10;
const pager=element('nav');pager.setAttribute('aria-label','Страницы Control Units');pager.style.marginTop='12px';const previous=element('button','← Новее','team'),next=element('button','Раньше →','team'),pageLabel=element('span');pageLabel.setAttribute('aria-live','polite');pageLabel.style.margin='0 12px';previous.type=next.type='button';pager.append(previous,pageLabel,next);root.querySelector('.table-scroll').before(pager);pager.style.marginBottom='12px';
function showPage(){closePanel();const state=pageState(data.units.length,pageSize,page);page=state.page;pairs.forEach((row,index)=>{const visible=Math.floor(index/2)>=state.start&&Math.floor(index/2)<state.end;if(index%2===0)row.hidden=!visible;else{row.hidden=true;pairs[index-1].querySelector('button.team').setAttribute('aria-expanded','false');}});previous.disabled=page===0;next.disabled=page===state.count-1;pageLabel.textContent=`Записи ${state.end?state.start+1:0}–${state.end} из ${data.units.length}`;pager.hidden=false;}
previous.addEventListener('click',()=>{page--;showPage();});next.addEventListener('click',()=>{page++;showPage();});showPage();
}
const views=Array.isArray(reportData.views)?reportData.views:[];
if(views.length){const toolbar=element('div',undefined,'views');toolbar.setAttribute('role','group');toolbar.setAttribute('aria-label','Выбор записей отчёта');const buttons=[];function choose(view){for(const item of buttons)item.button.setAttribute('aria-pressed',String(item.view===view));renderView({...reportData,...view});}for(const view of views){const button=element('button',view.label||view.id,'team');button.type='button';button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>choose(view));toolbar.append(button);buttons.push({view,button});}root.querySelector('header').after(toolbar);choose(views.find(view=>view.id===reportData.default_view)||views[0]);}else renderView(reportData);
})();
</script></section><!--REPORT_FRAGMENT_END--></body></html>
